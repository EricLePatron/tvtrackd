<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Icône d'application">
  <!-- Plein cadre, 100 % opaque (iOS refuse la transparence) : l'OS applique son propre masque.
       La charnière est remplie en #0B0E14 (bg-void) au lieu d'être transparente.
       Symbole mis à l'échelle 0,75 : il reste dans la safe zone maskable de 80 %. -->
  <rect width="64" height="64" fill="#1E2530"/>
  <g transform="translate(32 32) scale(0.75) translate(-32 -32)">
    <path d="M22 13V45L49 29Z" fill="#FF8A3D"/>
    <rect x="14" y="50" width="36" height="3" rx="1.5" fill="#4DD9C4"/>
  </g>
  <rect x="0" y="28.8" width="64" height="1.9" fill="#0B0E14"/>
</svg>
