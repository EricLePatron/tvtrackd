# --- Edge functions : auth au niveau du gateway ---
# Fonctions publiques (anon OK, cf. page 07) : le JWT ne doit PAS être exigé
# par le gateway, sinon le SSR/SEO anonyme (fiche, recherche, calendrier)
# reçoit un 401 avant d'atteindre la fonction.
[functions.search-media]
verify_jwt = false
[functions.get-show-details]
verify_jwt = false
[functions.trending-media]
verify_jwt = false
[functions.new-releases-media]
verify_jwt = false
[functions.public-calendar]
verify_jwt = false
[functions.similar-media]
verify_jwt = false
[functions.show-credits]
verify_jwt = false
[functions.person-credits]
verify_jwt = false

# Fonctions authentifiées : elles lisent Authorization: Bearer <token>,
# valident via admin.auth.getUser(token), puis opèrent avec la clé secrète
# nouvelle génération (cf. functions/_shared/admin.ts) scopée à l'utilisateur
# validé. Le gateway vérifie le JWT en amont (défaut) : d'après la doc Supabase
# actuelle (auth-headers), verify_jwt valide les JWT HS256 legacy ET ceux signés
# par les JWT Signing Keys asymétriques (ES256) : compatible après rotation.
# Le front n'envoie à ces fonctions que le access_token de la session (user JWT).
[functions.import-history]
verify_jwt = true
[functions.export-data]
verify_jwt = true
